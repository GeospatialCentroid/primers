project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - lessons/**/*.qmd

website:
  title: "R Primers"
  site-url: https://geospatialcentroid.github.io/primers/
  repo-url: https://github.com/GeospatialCentroid/primers
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Lessons
        menu:
          - text: "**Primers Basics**"
          - href: lessons/basics/programming-basics.qmd
            text: Programming Basics
          - href: lessons/basics/vis-basics.qmd
            text: Visualization Basics
          - text: "---"
          - text: "**Work with Data**"
          - href: lessons/transform-data/tibbles.qmd
            text: Tibbles
          - href: lessons/transform-data/isolating.qmd
            text: Isolating
          - href: lessons/transform-data/deriving.qmd
            text: Deriving
          - text: "---"
          - text: "**Visualize Data**"
          - href: lessons/visualize-data/bar-charts.qmd
            text: Bar Charts
          - href: lessons/visualize-data/histograms.qmd
            text: Histograms
          - href: lessons/visualize-data/boxplots.qmd
            text: Boxplots
          - href: lessons/visualize-data/scatterplots.qmd
            text: Scatterplots
          - href: lessons/visualize-data/line-graphs.qmd
            text: Line Graphs
          - href: lessons/visualize-data/overplotting.qmd
            text: Overplotting
          - href: lessons/visualize-data/customize.qmd
            text: Customize
          - text: "---"
          - text: "**Tidy your Data**"
          - href: lessons/tidy-data/reshape.qmd
            text: Reshape
          - href: lessons/tidy-data/separate.qmd
            text: Separate
          - href: lessons/tidy-data/join.qmd
            text: Join
          - text: "---"
          - text: "**Iterate**"
          - href: lessons/iterate/introduction-to-iteration.qmd
            text: Introduction to Iteration
          - href: lessons/iterate/map.qmd
            text: "purrr::map()"
          - text: "---"
          - text: "**Write Functions**"
          - href: lessons/write-functions/function-basics.qmd
            text: Function Basics
          - href: lessons/write-functions/how-to-write-a-function.qmd
            text: How to Write a Function
          - href: lessons/write-functions/arguments.qmd
            text: Arguments
    right:
      - icon: github
        href: https://github.com/GeospatialCentroid/primers
        aria-label: GitHub repository
  page-footer:
    center: >
      Adapted from the [RStudio Cloud Primers](https://github.com/rstudio-education/primers)
      under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/).
      Built by the Geospatial Centroid.

# Lesson pages use `live-html`, configured in lessons/_metadata.yml.
# Keep the two in sync.
format:
  html:
    theme: [cosmo, assets/styles.scss]
    toc: true
    toc-depth: 2
    code-copy: true
    include-after-body: [assets/quiz.html]

execute:
  freeze: false
